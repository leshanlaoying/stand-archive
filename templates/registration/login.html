{% extends 'base.html' %}
{% block title %}登录 · 看台档案{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-intro"><span class="section-kicker">WELCOME BACK</span><h1>欢迎回到<br><em>你的看台。</em></h1><p>登录后，继续记录那些让你心跳加速的比赛。</p></div><div class="auth-card"><h2>登录账号</h2>{% if form.errors %}<p class="form-error">用户名或密码不正确，请再试一次。</p>{% endif %}<form method="post" class="form-grid">{% csrf_token %}{{ form.as_div }}<input type="hidden" name="next" value="{{ next }}"><button class="button" type="submit">进入看台 ↗</button></form><p class="auth-switch">还没有账号？<a href="{% url 'register' %}">加入看台</a></p></div></section>{% endblock %}
